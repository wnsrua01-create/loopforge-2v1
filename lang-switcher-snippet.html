<!--
  LoopForge AI 다국어 언어 선택기 통합 스니펫
  사용법:
  1. index.html / id.html / ja.html / th.html / vi.html 각각 <nav> 안에 아래 CSS + HTML 삽입
  2. </body> 직전에 JS 삽입
  3. 각 파일에서 CURRENT_LANG 값만 변경
-->

<!-- ══════════════════════════════════════════
  [1] CSS — <style> 블록 안 맨 아래에 추가
════════════════════════════════════════════ -->
<style>
/* ── 언어 선택기 ── */
.lang-switcher{position:relative;margin-left:1rem;}
.lang-btn{display:flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--text);padding:.38rem .9rem;border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap;letter-spacing:.01em;}
.lang-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);}
.lang-btn .flag{font-size:1rem;line-height:1;}
.lang-btn .chevron{font-size:.6rem;color:var(--muted);transition:transform .2s;}
.lang-switcher.open .chevron{transform:rotate(180deg);}
.lang-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#1a1a1a;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.4rem;min-width:160px;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:999;}
.lang-switcher.open .lang-dropdown{display:block;animation:fadeDown .15s ease;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.lang-option{display:flex;align-items:center;gap:.7rem;padding:.5rem .8rem;border-radius:7px;cursor:pointer;transition:.15s;text-decoration:none;color:var(--text);font-size:.85rem;}
.lang-option:hover{background:rgba(255,255,255,.07);}
.lang-option.active{background:rgba(0,229,160,.1);color:var(--accent);}
.lang-option .flag{font-size:1.1rem;}
.lang-option .lang-name{font-weight:600;}
.lang-option .lang-native{font-size:.75rem;color:var(--muted);margin-left:auto;}

/* 모바일에서 언어 선택기 표시 */
@media(max-width:768px){
  .lang-switcher{margin-left:.5rem;}
  .lang-btn span.lang-label{display:none;} /* 모바일: 국기만 표시 */
}
</style>


<!-- ══════════════════════════════════════════
  [2] HTML — nav 안 .nav-links 바로 뒤에 추가
  ⚠ 각 페이지마다 active 클래스 위치만 바꿀 것
════════════════════════════════════════════ -->
<div class="lang-switcher" id="langSwitcher">
  <button class="lang-btn" id="langBtn" aria-label="언어 선택" aria-expanded="false">
    <span class="flag" id="currentFlag">🇰🇷</span>
    <span class="lang-label" id="currentLangLabel">한국어</span>
    <span class="chevron">▼</span>
  </button>
  <div class="lang-dropdown" role="menu">
    <a href="/index.html" class="lang-option active" data-lang="ko" role="menuitem">
      <span class="flag">🇰🇷</span>
      <span class="lang-name">한국어</span>
      <span class="lang-native">KR</span>
    </a>
    <a href="/id.html" class="lang-option" data-lang="id" role="menuitem">
      <span class="flag">🇮🇩</span>
      <span class="lang-name">Indonesia</span>
      <span class="lang-native">ID</span>
    </a>
    <a href="/ja.html" class="lang-option" data-lang="ja" role="menuitem">
      <span class="flag">🇯🇵</span>
      <span class="lang-name">日本語</span>
      <span class="lang-native">JA</span>
    </a>
    <a href="/th.html" class="lang-option" data-lang="th" role="menuitem">
      <span class="flag">🇹🇭</span>
      <span class="lang-name">ภาษาไทย</span>
      <span class="lang-native">TH</span>
    </a>
    <a href="/vi.html" class="lang-option" data-lang="vi" role="menuitem">
      <span class="flag">🇻🇳</span>
      <span class="lang-name">Tiếng Việt</span>
      <span class="lang-native">VI</span>
    </a>
  </div>
</div>


<!-- ══════════════════════════════════════════
  [3] JS — </body> 직전에 추가
  ⚠ CURRENT_LANG 값을 각 페이지에 맞게 변경
     index.html → 'ko'
     id.html    → 'id'
     ja.html    → 'ja'
     th.html    → 'th'
     vi.html    → 'vi'
════════════════════════════════════════════ -->
<script>
(function(){
  var CURRENT_LANG = 'ko'; // ← 각 페이지마다 변경

  var LANGS = {
    ko: { flag:'🇰🇷', label:'한국어', file:'/' },
    id: { flag:'🇮🇩', label:'Indonesia', file:'/id.html' },
    ja: { flag:'🇯🇵', label:'日本語',  file:'/ja.html' },
    th: { flag:'🇹🇭', label:'ภาษาไทย', file:'/th.html' },
    vi: { flag:'🇻🇳', label:'Tiếng Việt', file:'/vi.html' }
  };

  // ── 버튼 현재 언어로 초기화
  var currentFlag  = document.getElementById('currentFlag');
  var currentLabel = document.getElementById('currentLangLabel');
  if(currentFlag && LANGS[CURRENT_LANG]){
    currentFlag.textContent  = LANGS[CURRENT_LANG].flag;
    currentLabel.textContent = LANGS[CURRENT_LANG].label;
  }

  // ── active 클래스 설정
  document.querySelectorAll('.lang-option').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-lang') === CURRENT_LANG);
  });

  // ── 드롭다운 토글
  var switcher = document.getElementById('langSwitcher');
  var btn      = document.getElementById('langBtn');
  if(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var isOpen = switcher.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen);
    });
  }
  document.addEventListener('click', function(){
    if(switcher) switcher.classList.remove('open');
  });

  // ── 언어 클릭 시 localStorage 저장
  document.querySelectorAll('.lang-option').forEach(function(el){
    el.addEventListener('click', function(){
      localStorage.setItem('lf_lang', el.getAttribute('data-lang'));
    });
  });

  // ── 최초 방문 시 브라우저 언어 자동 감지 (저장값 없을 때만)
  var savedLang = localStorage.getItem('lf_lang');
  if(!savedLang){
    var browserLang = (navigator.language || navigator.userLanguage || 'ko').split('-')[0];
    var supported   = ['ko','id','ja','th','vi'];
    if(supported.indexOf(browserLang) !== -1 && browserLang !== CURRENT_LANG){
      localStorage.setItem('lf_lang', browserLang);
      window.location.href = LANGS[browserLang].file;
    }
  }
})();
</script>
